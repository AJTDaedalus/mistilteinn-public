name: Security Scan

# ---------------------------------------------------------------------------
# What this workflow covers: SAST (bandit), dependency audit (pip-audit,
# npm audit against a reviewed allowlist), and secret scanning (gitleaks).
#
# What it does NOT cover: DAST. There is no ZAP job here and never was — the
# baseline scan in security/zap/ is a manual step. TASKS A.11 assumed a job in
# this file to gate; there is none, so the guard lives in the only place the
# scan is invoked from: security/zap/run-baseline.sh, which is opt-in
# (ZAP_SCAN_ENABLED=1) and additionally refuses to scan a target that is not
# serving. Both refusals exit non-zero, because a skipped check blocks.
#
# TODO(chunk-K): once mistilteinn.aetherus.dev has a real origin, decide
# whether the baseline scan becomes a scheduled job here. Do not add one that
# runs against a dead host — aetherus.dev has wildcard DNS, so an unreachable
# target still answers, and an unguarded scan reports ~59 PASS against a
# Cloudflare error page. See security/zap/README.md.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install "backend/.[dev]" bandit pip-audit

      - name: bandit
        run: bandit -r backend/app -ll  # fail on medium+ severity

      - name: pip-audit
        run: pip-audit --local
        shell: bash

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: npm audit (allowlisted)
        # Still audits devDependencies (a build-tool supply-chain compromise is a real
        # risk) but only fails on a GHSA advisory not already reviewed in
        # audit-allowlist.txt — and fails if an allowlisted ID is no longer reported
        # (stale — must be removed), so the list can't rot in either direction. Same
        # discipline as backend/app/data/validation/known_issues.json in the
        # kit-validation harness (D-KV7). See frontend/audit-allowlist.txt and
        # docs/LOG_kit_validation.md (PR #67 CI diagnosis, round 3).
        run: bash scripts/check-audit-allowlist.sh
        working-directory: frontend

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git log mode

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
