name: Deploy to prod

# Auto-deploys the prod stack whenever `dev` advances.
#
# Adapted from fairy's, which runs on the same box. The scars in that file were earned on
# this hardware and are kept, not rediscovered — the IPv4 health-check address, the
# anonymous-volume renewal, the rollback that does not swallow a stale-data failure.
#
# ── What is different, and why ───────────────────────────────────────────────
#
# **A different runner label.** A self-hosted runner is registered to one repository, so
# fairy's `fairy-prod` runner cannot take jobs from this repo even though it is the same
# machine. mistilteinn needs its own registration on the same box, labelled
# `mistilteinn-prod`. See docs/DEPLOY.md §2.
#
# **A different directory.** `/home/ubuntu/mistilteinn`, holding this stack's `.env` and its
# own `postgres-data` bind mount. Never `/home/ubuntu/fairy` — the deleted version of this
# file targeted exactly that and would have redeployed fairy's production directory from
# this repo's `dev`.
#
# **A seed-verification job of a different kind.** fairy's second job runs its kit-validation harness against
# the live database, because fairy's correctness depends on curated data a human had to
# remember to re-seed. mistilteinn's game data is *derived*: seeded by
# `scripts.seed_db` from a pinned nanoka snapshot, with `seed_runs` recording which patch
# the database holds and whether the run finished. The equivalent check is
# `scripts.verify_seed`, and it is run here for the same reason fairy runs L4 — **a
# migration without a re-seed deploys green, health-checks green, and serves stale data
# silently.**

on:
  push:
    branches: [dev]
  # Manual re-run, with the option to re-seed first.
  #
  # `verify-seed`'s failure message names a command, and until this existed the command
  # needed a shell on the prod box — so the documented remedy for a *routine* state was
  # reachable only by the one person with SSH. It is routine because every column the
  # catalogue grows puts prod into it: `alembic upgrade head` adds the column, nothing
  # re-runs the importer, and the rows are NULL until someone notices. That is how prod
  # got 360 enemies with no icon.
  #
  # Off by default, and deliberately not automatic on every deploy. A seed is a ten-second
  # write across 19 tables, and running it unasked on each push would make the one command
  # that rewrites the catalogue the one nobody was watching.
  workflow_dispatch:
    inputs:
      reseed:
        description: "Re-seed the catalogue at the pinned nanoka version before verifying"
        type: boolean
        default: false

# Never let two deploys overlap; queue them rather than cancelling a half-done one.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull, rebuild, migrate, health-check
    runs-on: [self-hosted, mistilteinn-prod]
    env:
      REPO_DIR: /home/ubuntu/mistilteinn
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
      # Resolved from inside the frontend (nginx) container — prod publishes no host ports.
      # 127.0.0.1 rather than localhost: /etc/hosts maps localhost to ::1 as well, and nginx
      # listens on IPv4 only, so a probe that lands on ::1 is refused. fairy's lesson.
      HEALTH_URL: http://127.0.0.1/api/v1/health

    steps:
      - name: Update working tree to origin/dev
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          BEFORE=$(git rev-parse HEAD)
          git fetch origin dev
          git reset --hard origin/dev
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_ENV"
          echo "after=$AFTER"   >> "$GITHUB_ENV"
          echo "Deploying $BEFORE -> $AFTER"

      - name: Vendor the catalogue art
        # **Before the rebuild, on purpose.** The art is HoYoverse's and left the repository
        # on 2026-11-10 (docs/DECISIONS.md), so the reset above deletes any icon an older
        # commit tracked. The frontend that is still running serves art baked into its image,
        # so filling the host directory *now* means the rebuilt container mounts a complete
        # one. A gap would be expensive: Cloudflare caches a 404 for hours.
        #
        # Runs in the backend image that is already built. `download_icons` writes to
        # `<root>/frontend/public/icons`, which is `/frontend/public/icons` in an image whose
        # code is at `/app`, and that path is what the mount supplies. `--user` so the files
        # belong to the runner's user, the same one that owns the checkout. Fetches only what
        # is missing, so a routine deploy makes no request to nanoka at all.
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          # Created here rather than by Docker, which would create a missing bind source as
          # root and leave the download unable to write into it.
          mkdir -p frontend/public/icons
          $COMPOSE run --rm -T --user "$(id -u):$(id -g)" \
            -v "$REPO_DIR/frontend/public/icons:/frontend/public/icons" \
            backend python -m scripts.download_icons

      - name: Rebuild and restart stack
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          $COMPOSE up -d --build
          # The frontend's anonymous node_modules/.angular volumes persist across
          # recreation and mask new dependencies, so a plain rebuild ships the old ones.
          if git diff --name-only "$before" "$after" \
               | grep -qE '^frontend/package(-lock)?\.json$'; then
            echo "Frontend deps changed -> renewing anonymous volumes"
            $COMPOSE up -d --force-recreate --renew-anon-volumes frontend
          fi

      - name: Apply database migrations
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          # Idempotent: a no-op when already at head.
          $COMPOSE run --rm backend alembic upgrade head

      - name: Vendor what the new downloader asks for
        # **Again, after the rebuild.** The pass above runs the *old* backend image, so an icon
        # this deploy taught `download_icons` to fetch is not fetched by it. That happened on
        # the first deploy without committed art: Mora's icon, which no catalogue row names,
        # was missing until this step existed. The first pass keeps the transition gapless;
        # this one makes the new code's list the one that holds. Fetches only what is
        # missing, so it is free on a routine deploy.
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          mkdir -p frontend/public/icons
          $COMPOSE run --rm -T --user "$(id -u):$(id -g)" \
            -v "$REPO_DIR/frontend/public/icons:/frontend/public/icons" \
            backend python -m scripts.download_icons

      - name: Seed the furnishing suites
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          # **On every deploy, not on the manual re-seed job**, and the difference matters.
          # `seed_db` needs a version negotiated against upstream and is therefore deliberate;
          # this reads a **committed fixture** at the pinned version, touches no network, and
          # upserts by `nanoka_id`, so running it every time is a no-op once seeded.
          #
          # It is here because the alternative is the failure this file's own header names: a
          # migration without a seed **deploys green, health-checks green, and serves an empty
          # page**. The teapot tracker would render zero sets and nothing would say why.
          #
          # It refuses a truncated capture rather than deleting rows, so a bad fixture fails
          # the deploy instead of emptying the table.
          $COMPOSE run --rm backend python -m scripts.seed_teapot

      - name: Seed wish income from the committed snapshot
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          # The same argument as the step above, for the same reason. `wish_income` is empty
          # after its migration, and an empty income table makes `/wishes` hide its "add
          # upcoming patches" control entirely — a deploy that is green, health-checks green,
          # and serves a feature with a piece silently missing.
          #
          # `--from-snapshot` reads `app/data/wishes/income_snapshot.json`, a committed file,
          # and touches **no network**: the bookkeeping workbook is never on the deploy path.
          # It replaces the table wholesale and refuses an implausible shrink, so a mangled
          # snapshot fails the deploy rather than emptying the table.
          #
          # The daily systemd timer in `deploy/wish-income/` keeps it current after this; this
          # step exists so the first deploy does not have to wait for it.
          $COMPOSE run --rm backend python -m scripts.refresh_wish_income --from-snapshot

      - name: Seed the banner roster from the committed snapshot
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          # The third seed for the third reason that is the same reason. An empty
          # `wish_banners` makes /wishes offer no banner to pick, so the refund silently
          # falls back to the constant tier and the picker renders nothing — green deploy,
          # green health check, a feature missing its middle.
          #
          # `--from-snapshot` reads app/data/wishes/banners.json, a committed file, and
          # touches **no network**: the wiki is never on the deploy path. It refuses an
          # implausible shrink, so a mangled snapshot fails the deploy rather than emptying
          # the table, and the rollback step below covers it.
          $COMPOSE run --rm backend python -m scripts.refresh_banners --from-snapshot

      - name: Health check
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          for i in $(seq 1 30); do
            if $COMPOSE exec -T frontend wget -qO- --timeout=5 "$HEALTH_URL" \
                 | grep -q '"status":"ok"'; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Not healthy yet (attempt ${i}); retrying in 3s..."
            sleep 3
          done
          echo "::error::Health check failed after deploy."
          exit 1

      - name: The bundle serves the simulator
        # **A 200 is not the check here, and could never have been.** `gcsim.wasm` and
        # `wasm_exec.js` are gitignored, so the prod image was built without them; the
        # `angular.json` asset globs matched nothing and succeeded; nginx answered
        # `/gcsim/wasm_exec.js` with the SPA fallback — `200 text/html` — and every rotation
        # optimize died with "could not load gcsim/wasm_exec.js". The build was green, the
        # deploy was green, and this health check passed, for as long as that was true.
        #
        # So this asserts the **content type**, which is the only thing that differs between a
        # file that is there and one the fallback invented. Exactly the lesson `DECISIONS.md`
        # §4 records about the icons, applied to the other asset it is true of.
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          fail=0
          for path in gcsim/wasm_exec.js gcsim/gcsim.wasm; do
            type="$($COMPOSE exec -T frontend wget -S -qO /dev/null "http://127.0.0.1/${path}" 2>&1 \
                    | grep -i '^ *Content-Type:' | head -1 | tr -d '\r' || true)"
            case "${type}" in
              *javascript*|*wasm*) echo "ok  ${path} — ${type# }" ;;
              *) echo "::error::${path} is served as '${type:-nothing}', not a script or wasm."
                 echo "::error::That is nginx's SPA fallback: the bundle does not carry it."
                 fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: The mount serves the catalogue art
        # The same content-type rule as above, for the asset that taught it. An icon that is
        # missing, or a mount pointed at the wrong path, answers `200 text/html` from the SPA
        # fallback unless `/icons/` keeps its `=404`, and either way only the type tells a
        # real file apart. Ayaka has shipped since 1.x, so her portrait is always vendored.
        # Mora (`UI_ItemIcon_202`) is named by no catalogue row, so it arrives only through
        # the downloader's own list, and only after the post-rebuild pass.
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          for path in icons/UI_AvatarIcon_Ayaka.webp icons/UI_ItemIcon_202.webp; do
            type="$($COMPOSE exec -T frontend wget -S -qO /dev/null "http://127.0.0.1/${path}" 2>&1 \
                    | grep -i '^ *Content-Type:' | head -1 | tr -d '\r' || true)"
            case "${type}" in
              *image/webp*) echo "ok  ${path} — ${type# }" ;;
              *) echo "::error::${path} is served as '${type:-nothing}', not image/webp."
                 echo "::error::The icon mount is empty or wrong — see the two vendoring steps."
                 exit 1 ;;
            esac
          done

      - name: What the edge is actually serving
        # **The check above probes the origin, and users do not.** It runs `wget` inside the
        # frontend container against 127.0.0.1, so it is blind to Cloudflare — and Cloudflare
        # is where this exact failure lived. Measured minutes after the fix deployed:
        #
        #     wasm_exec.js  cf-cache-status: HIT  age: 2361  content-type: text/html
        #     gcsim.wasm    cf-cache-status: DYNAMIC         content-type: application/wasm
        #
        # `.js` is a Cloudflare default-cached extension and `.wasm` is not, so the edge held
        # the pre-fix SPA fallback for four hours while the origin was correct. That is the
        # icons incident's second half, and nothing in this pipeline could see it.
        #
        # **A warning, not a failure.** The origin is what a deploy controls; an edge entry
        # cached before the fix is real, is not this deploy's fault, and expires. Failing here
        # would block every deploy in that window over something already fixed. Saying so, with
        # the purge named, is the actionable half.
        continue-on-error: true
        run: |
          set -uo pipefail
          for path in gcsim/gcsim.wasm gcsim/wasm_exec.js; do
            url="https://mistilteinn.aetherus.dev/${path}"
            code="$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 20 "$url" || echo 000)"
            # **The status first, because the message below diagnoses a stale cache.** Without
            # this, a tunnel outage or a Cloudflare 5xx — both of which answer with no usable
            # content type — were reported as "the origin is correct, purge the edge", which is
            # a confident wrong diagnosis and a purge that would not help. `000` is curl failing
            # to connect at all.
            if [ "$code" != "200" ]; then
              echo "::warning::${path} answers ${code} at the edge. That is not a stale cache:"
              echo "::warning::the origin check above passed, so the tunnel or Cloudflare is down."
              continue
            fi
            headers="$(curl -sI --max-time 20 "$url" || true)"
            type="$(grep -i '^content-type:' <<<"$headers" | tr -d '\r' || true)"
            status="$(grep -i '^cf-cache-status:' <<<"$headers" | tr -d '\r' || true)"
            case "$type" in
              *javascript*|*wasm*) echo "ok  ${path} — ${type}  ${status}" ;;
              *) echo "::warning::${path} reaches users as '${type:-nothing}' (${status:-no cf header})."
                 echo "::warning::The origin is correct; Cloudflare is holding a pre-fix copy."
                 echo "::warning::Purge it: Cloudflare dashboard → Caching → Purge by URL, or"
                 echo "::warning::  curl -X POST .../zones/<zone>/purge_cache -d '{\"files\":[\"https://mistilteinn.aetherus.dev/${path}\"]}'" ;;
            esac
          done

      - name: Rollback on failure
        if: failure() && env.before != ''
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          echo "::warning::Deploy failed — rolling back to ${before}"
          git reset --hard "$before"
          $COMPOSE up -d --build
          $COMPOSE run --rm backend alembic upgrade head || true

  reseed:
    # Only ever on an explicit dispatch. `if` on the job rather than the step so that a
    # normal deploy shows this as *skipped* instead of green — a green box beside "reseed"
    # on a run that seeded nothing is the kind of thing a reader remembers wrongly later.
    name: Re-seed the catalogue from the pinned snapshot
    if: ${{ inputs.reseed }}
    needs: deploy
    runs-on: [self-hosted, mistilteinn-prod]
    env:
      REPO_DIR: /home/ubuntu/mistilteinn
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - name: seed_db against the live database, at the pinned version
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          # PASS THE VERSION, and pass **today's**. Owner ruling, 2026-09-19: a re-seed
          # takes the version nanoka publishes now.
          #
          # This job used to read `verify_seed.FIXTURE_VERSION` so the seed and the offline
          # check could not disagree. That was right while upstream kept old versions — and
          # **nanoka deletes them**. `gi/6.7` is a 404 today, and the committed fixtures are
          # 9 payloads of the ~1,086 a seed reads, so a pin we cannot re-fetch is a pin we
          # cannot re-seed. `verify-seed` below now runs `--live`, against the version
          # `seed_runs` records for this run.
          #
          # Resolved in one place and echoed, rather than left to `seed_db`'s own default:
          # **one pin per run** is still the rule. What N.2 and the first run of this job
          # both hit was a version nobody could name afterwards, not the following of
          # upstream as such.
          VERSION="$($COMPOSE run --rm -T backend python -m scripts.nanoka_latest_version)"
          VERSION="$(echo "$VERSION" | tr -d '[:space:]')"
          # An empty read would fall through to `--version ''` and, worse, could be taken for
          # a successful pin.
          test -n "$VERSION"
          echo "Seeding prod at nanoka $VERSION, the version published today."

          # No `--force-prune`, and that is the point. If an index comes back empty or
          # truncated — a valid 200 that no retry can detect — the pass reports
          # `PRUNE REFUSED`, exits non-zero and deletes nothing, because deleting the
          # catalogue takes every user's builds with it through ON DELETE CASCADE.
          # Overriding that is a decision someone makes after reading the numbers, not a
          # flag a workflow carries permanently.
          $COMPOSE run --rm -T backend python -m scripts.seed_db --version "$VERSION"

      - name: Vendor art for whatever the seed added
        # A patch adds characters, weapons and enemies whose art nothing has fetched yet. The
        # frontend mounts this directory live, so the new files serve without a rebuild. Same
        # command and the same reasons as the deploy job's step.
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          mkdir -p frontend/public/icons
          $COMPOSE run --rm -T --user "$(id -u):$(id -g)" \
            -v "$REPO_DIR/frontend/public/icons:/frontend/public/icons" \
            backend python -m scripts.download_icons

  verify-seed:
    # SEPARATE JOB, deliberately — the same reasoning fairy wrote down. `deploy` ends with a
    # `Rollback on failure` step, so a verification step inside it would roll **working
    # code** back because the *data* is stale. That is strictly worse than the problem. This
    # job cannot trigger that rollback: its failure leaves the deployment in place and says
    # loudly that prod needs a re-seed.
    name: Verify the prod seed against the real database
    # `needs` both, but `reseed` is skipped on every push — and a skipped dependency would
    # skip this job too under the default rule, silently retiring the check on exactly the
    # runs it exists for. The condition re-states what "skipped is fine, failed is not"
    # means, which is the same distinction this job draws about its own subject.
    needs: [deploy, reseed]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.reseed.result != 'failure' }}
    runs-on: [self-hosted, mistilteinn-prod]
    env:
      REPO_DIR: /home/ubuntu/mistilteinn
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - name: verify_seed against the seeded prod database
        run: |
          set -uo pipefail
          cd "$REPO_DIR"
          # `|| rc=$?` rather than a bare assignment. GitHub runs `run:` under `bash -e`,
          # and `set -uo pipefail` does not turn `-e` off — so `out="$(cmd)"` aborts the
          # step the instant cmd exits non-zero, before anything is printed. The operator
          # then sees `Process completed with exit code 1` and nothing else, which defeats
          # the job's entire purpose. fairy shipped that bug once; it is not repeated here.
          # `tests/` is excluded from the runtime image by backend/.dockerignore — correct
          # for a runtime image, and fatal for this check: `verify_seed` reads the committed
          # nanoka indexes under tests/fixtures/nanoka_gi to compare against what was
          # actually seeded. Without them it dies on FileNotFoundError, which is a *skip*
          # wearing a failure's clothes: it proves nothing about the data.
          #
          # The repo is checked out on this box, so the fixtures are mounted read-only for
          # the one-off run. Shipping them inside the image would put test data in a runtime
          # artifact to serve a verification tool, which is the wrong trade.
          #
          # Found by deploying. It could not have been found by reading, because the
          # dev-time invocation runs from a source tree where the path simply exists.
          rc=0
          out="$($COMPOSE run --rm -T \
                   -v "$REPO_DIR/backend/tests/fixtures:/app/tests/fixtures:ro" \
                   backend python -m scripts.verify_seed --live 2>&1)" || rc=$?
          echo "$out"

          # A SKIP IS NOT A PASS. An unseeded database is precisely the state this job
          # exists to catch, and "could not check" exiting 0 is the green-by-absence
          # failure this repo took from fairy as a founding rule.
          if echo "$out" | grep -qiE 'skipped|no seed run|database is empty'; then
            echo "::error::verify_seed could not check prod — the database is unseeded, or was migrated without a re-seed. Run 'docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend python -m scripts.seed_db' on the box, then re-run this job. The deployment is left in place."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::verify_seed found problems against the live database. Usually this means the deployed code expects game data this database has not been seeded with. The deployment is left in place; re-seed and re-run."
            exit "$rc"
          fi

          echo "Prod seed verified against real data."
