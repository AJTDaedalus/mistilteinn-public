name: Tests

# ---------------------------------------------------------------------------
# PORT STATE (Chunk A, 2026-08-21) — read before trusting a green run here.
#
# This workflow came from fairy and was built around its kit-validation harness. That job
# is **retired** — Chunk S found gcsim already implements the kits the corpus existed to
# curate — and the stanza where it stood records where each of its validation levels went
# rather than leaving a gap nobody can account for.
#
# The backend suite went green at Chunk B's exit gate (B.13) and stays that way:
# 24 test files, 220 tests, 1 skipped (tests/perf, awaiting G.7). A red run here is
# a regression, not "the size of the port" — that excuse expired at B.13. See
# CLAUDE.md's repo-state section.
#
# Everything here is HERMETIC: no network, no seeded game data. The integration
# lane stands up an EMPTY Postgres and the suite builds its own schema via
# `Base.metadata.create_all` plus per-test fixtures — hermetic means "no external
# state this workflow does not create", not "no database".
# ---------------------------------------------------------------------------

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Ruff
        # `scripts/` as a whole is not linted: it carries ~65 pre-existing violations in
        # unrelated one-off scripts, and fixing them is not this lane's job. The scripts
        # something *depends on* are named individually, which is the convention fairy used
        # for its harness — an unlinted script that a gate runs is a gate nobody trusts.
        # Chunk D adds the three that seed and verify the database.
        #
        # Retired with the kit-validation job: fairy additionally linted `scripts/validate_kits.py` and
        # `scripts/refresh_kit_refs.py` by name. Both are deleted in B.9, and **they have no
        # Genshin replacement coming** — the earlier note here said to re-add one "when Chunk H
        # ports the harness", and Chunk H is closed: gcsim implements the kits that harness
        # existed to check. Nothing is waiting on this line.
        run: >-
          ruff check app/ tests/
          scripts/seed_db.py scripts/verify_seed.py scripts/capture_nanoka_fixtures.py
          scripts/yuanshen/ scripts/bench_optimizer.py scripts/gcsim/ scripts/kernel/
          scripts/inject.py scripts/ci_local.py scripts/download_icons.py

      - name: Unit tests
        # Unit only. Integration runs in its own job below so this lane stays fast
        # and dependency-free — not because integration is unrunnable here.
        run: pytest tests/unit -q

      - name: Performance baseline
        # `-m perf` is deselected by default, so this step is the only thing that runs it.
        # Without it the file would be green-by-absence — fairy's crossval failure in a new
        # costume, and this repo's rule is that a check which did not run is not a pass.
        # `tests/unit/test_ci_runs_the_perf_gate.py` fails if this step or its `-m perf`
        # flag goes away; both cases were checked by removing them.
        #
        # No database and no network: the inventory is synthetic and shared with
        # `scripts/bench_optimizer.py`. The timing assertion is an order-of-magnitude guard
        # with an 8x band, because this runner is slower and noisier than the machine
        # `SECONDS_PER_COMBINATION` was measured on; the other two assertions are exact.
        run: pytest tests/perf -m perf -q

  integration:
    # The comment this job replaces said integration tests "need a seeded Postgres,
    # which this lane deliberately does not stand up". Half of that is wrong, and the
    # wrong half is why 500+ tests sat outside CI: `tests/conftest.py` builds the
    # schema with `Base.metadata.create_all` and every test creates its own fixtures,
    # so the suite needs an EMPTY Postgres and no seed, no migrations, and no network.
    # It is exactly as hermetic as the unit lane.
    #
    # What that cost: `test_a_mixed_voidflare_store_splits_by_provenance` went red the
    # moment E-F3 landed in Phase 2 and stayed red for the whole phase, because the
    # only thing that ran it was a developer remembering to. PR #113 found it by
    # accident. Two subsequent reviews had to verify 500 tests by hand.
    #
    # fairy's genuinely seeded-DB tests (test_zo_crossval.py) skipped themselves here,
    # because `DATABASE_URL` points at this same empty database. Those files are deleted
    # in B.12.
    #
    # RESOLVED in F.7: the `Crossval` step below runs with `CROSSVAL_REQUIRE_DB=1`, so a
    # skip is a hard failure in the lane that is supposed to run it — fairy shipped a stale
    # golden fixture precisely because a skip read as a pass here. The harness seeds its own
    # schema from the committed nanoka fixtures through the real importer, so it stays as
    # hermetic as the rest of this lane: no network, no seed step, no migrations.
    name: Backend — integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mistilteinn
          POSTGRES_PASSWORD: mistilteinn_dev
          POSTGRES_DB: mistilteinn_test
        ports:
          - 5432:5432
        # Without this the job races the container: asyncpg connects before Postgres
        # finishes its first-boot init and the whole suite errors on connection.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mistilteinn:mistilteinn_dev@localhost:5432/mistilteinn_test
      DATABASE_URL: postgresql+asyncpg://mistilteinn:mistilteinn_dev@localhost:5432/mistilteinn_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Crossval against gcsim
        # CROSSVAL_REQUIRE_DB=1 is the whole point: without it an unreachable database
        # makes these tests skip, and a skipped crossval is what let fairy ship a stale
        # golden fixture. Here a skip is a failure. See tests/crossval/conftest.py.
        env:
          CROSSVAL_REQUIRE_DB: "1"
        run: pytest tests/crossval -q

  # ── The kit-validation job is retired, and here is where its levels went ────
  #
  # fairy dispatched a `validate_kits.py` harness over a curated ZZZ kit corpus. The corpus
  # was stripped in the fork commit and the job has sat `if: false` since A.10, on the
  # correct principle that a gate silently removed becomes a permanent gap.
  #
  # **Chunk S retired the premise.** gcsim implements 106 characters and 53 artifact sets at
  # the pin — the corpus Chunk H existed to curate — so H is superseded, and this job would
  # never have been restored as written. Leaving it disabled would leave a stanza pointing at
  # a chunk that is not coming.
  #
  # The levels did not all die with it. Where each went:
  #
  #   L0  schema        — no kit JSON exists; gcsim owns kit implementation. Gone with the
  #                       premise, rather than quietly dropped.
  #   L1  references    — snapshot provenance: every derived file records its
  #   L2  citations       `pinned_commit_sha` and its source tables, asserted by
  #                       tests/unit/test_yuanshen_snapshot.py, test_artifact_roll_schedule.py
  #                       and test_gcsim_pin_is_single.py. The citation discipline moved from
  #                       hand-written kits to machine-derived snapshots, which is stricter.
  #   L6  coverage      — tests/unit/test_gcsim_character_coverage.py. "Every seeded character
  #                       has a kit entry" became "every seeded character resolves to a gcsim
  #                       key, or is on a reviewed list of ones that do not": 117 of 150
  #                       resolve, and the 33 that do not are committed so a re-pin shows up
  #                       as a diff rather than as a surprise in someone's search.
  #   LC  consistency   — tests/crossval recomputes a committed gcsim run and matches it to
  #                       1.3e-8. A contradiction between our chain and gcsim's is what it
  #                       catches, against the oracle rather than between kits.
  #   LU  unmapped      — `_quantity_for_prop` raises on a prop with no DAG quantity, and
  #                       test_genshin_enums.py asserts the vocabulary against the fixtures.
  #   L4/L5             — stayed out of CI in fairy and have no Genshin equivalent to carry.
  #
  # If a curated corpus ever returns, this stanza is in the history at the commit that
  # removed it, along with fairy's dispatch rules — including the one worth keeping: never
  # restore it as `--level l0 --level l1 ...`, because the stale-waiver check was gated on
  # `set(levels) == set(LEVELS)` and narrowing the dispatch switched staleness detection off
  # for the levels that *were* listed.

  frontend:
    name: "Frontend — typecheck, lint, unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build the gcsim browser wasm
        # Not vendored — 40 MB, and a fresh blob on every re-pin. `frontend/gcsim/
        # PROVENANCE.md` explains the choice and names the two precedents in this repo that
        # point the same way. The pin comes from docs/CROSSVAL_gcsim.md; nothing restates it.
        run: npm run gcsim:build

      - name: Verify it agrees with the oracle
        # The whole client-side architecture rests on the browser build producing the same
        # numbers as the crossval fixture, the native binary and the WASI probe. Asserted
        # here rather than assumed, and it exits non-zero on any other value.
        run: npm run gcsim:verify

      - name: Verify the app's runner agrees with it too
        # W.1. The step above proves the *wasm* is right. This proves the code the app
        # actually calls — `src/app/sim/gcsim.ts` — drives it correctly, by importing that
        # module rather than re-hand-rolling the initialize/simulate/flush sequence beside it.
        # A gate that re-implements what it checks can pass while the shipped path is broken.
        run: npm run gcsim:verify-runner

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Emit sample gcsim configs
        # The emitter is Python and the only authority on what a valid config is is a
        # WebAssembly module, so the two halves meet through files rather than a claim.
        working-directory: backend
        run: |
          pip install -e .
          python -m scripts.gcsim.emit_sample_configs

      - name: Verify gcsim accepts what we emit
        # A config that parses in our head and not in gcsim's is worth nothing, and would
        # surface as a runtime error inside a Web Worker rather than as a failing test.
        run: npm run gcsim:verify-config

      - name: Verify the kernel against the differential harness
        # DESIGN §6's gate: the browser kernel is a second damage chain, and this is what
        # binds it to the first. 2,000 generated cases, each carrying the Python chain's
        # answer, matched to the 1e-6 derived in docs/CROSSVAL_gcsim.md. It also fails if the
        # worst case creeps past half the tolerance — a gate that is only just passing is one
        # about to be widened.
        run: npm run kernel:verify

      - name: Verify the kernel's search against the Python optimizer
        # C.3's gate pins the kernel's arithmetic; this pins its search. Same inventory, same
        # winner — including the lossless Pareto layer removing the same pieces, which is
        # arithmetic rather than a heuristic and so must agree exactly.
        run: npm run kernel:verify-search

      - name: Install a software Vulkan driver
        # OQ-S4's answer needs this, and the first attempt got it wrong by generalising from
        # a dev box. Runners ship `libvulkan` but **no ICD**, so Dawn fails with
        # `vkCreateInstance: Found no drivers!` and there is no adapter at all.
        # `mesa-vulkan-drivers` provides lavapipe (`lvp_icd.json`), a CPU Vulkan
        # implementation — which is what lets the WGSL path be tested without GPU hardware.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Verify the GPU kernel
        # OQ-S4 answered: runners have no GPU, but with lavapipe installed above Dawn gets a
        # software adapter, so the WGSL path is genuinely exercised rather than exempted.
        # Software adapters are slow and that does not matter: this checks what the shader
        # computes, not how fast. If no adapter exists at all it FAILS, because a skip would
        # be the third damage chain shipping unverified.
        run: npm run kernel:verify-gpu

      - name: Typecheck
        # `tsconfig.app.json`, **not** the root `tsconfig.json`. The root config has
        # `files: []` and no `include`, so `tsc -p tsconfig.json` compiles nothing and
        # exits 0 — it reported a clean frontend while 147 errors sat in the app. That was
        # caught only by injecting a deliberate type error and noticing it passed too.
        # `backend/tests/unit/test_ci_typechecks_the_frontend.py` fails if this step or its
        # project flag goes away.
        run: npm run typecheck

      - name: Lint
        # eslint does not full-type-check, which is why the step above exists separately.
        run: npm run lint

      - name: Unit tests
        # Re-enabled in A.2 (client-optimizer plan). It was disabled with a
        # `TODO(chunk-J)` because `npm test` and `npm run build` both failed to compile:
        # 147 TypeScript errors against endpoints and schemas B.6 deleted. The SPA was
        # fairy's ZZZ frontend, and the fix was that chunk's fix — delete the ZZZ pages
        # rather than alias them. 8 files, 59 tests.
        run: npm test
