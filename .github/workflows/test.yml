name: Tests

# ---------------------------------------------------------------------------
# PORT STATE (Chunk A, 2026-08-21) — read before trusting a green run here.
#
# This workflow came from fairy and was built around its kit-validation harness.
# The ZZZ kit corpus (app/data/{modifiers,validation,skill_overrides}) was stripped
# in the fork commit, so the `kit-validation` job below dispatches a script against
# data that no longer exists. It is DISABLED, not deleted — see the TODO(chunk-H)
# block on the job itself for exactly what has to come back and when.
#
# The backend suite went green at Chunk B's exit gate (B.13) and stays that way:
# 24 test files, 220 tests, 1 skipped (tests/perf, awaiting G.7). A red run here is
# a regression, not "the size of the port" — that excuse expired at B.13. See
# CLAUDE.md's repo-state section.
#
# Everything here is HERMETIC: no network, no seeded game data. The integration
# lane stands up an EMPTY Postgres and the suite builds its own schema via
# `Base.metadata.create_all` plus per-test fixtures — hermetic means "no external
# state this workflow does not create", not "no database".
# ---------------------------------------------------------------------------

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Ruff
        # `scripts/` as a whole is not linted: it carries ~65 pre-existing violations in
        # unrelated one-off scripts, and fixing them is not this lane's job.
        #
        # TODO(chunk-H): fairy additionally linted `scripts/validate_kits.py` and
        # `scripts/refresh_kit_refs.py` by name, so the two the harness depends on could
        # not rot. Both are deleted in B.9. Re-add their Genshin replacements here when
        # Chunk H ports the harness — the point of naming them was that an unlinted
        # harness script is a harness nobody trusts.
        run: ruff check app/ tests/

      - name: Unit tests
        # Unit only. Integration runs in its own job below so this lane stays fast
        # and dependency-free — not because integration is unrunnable here.
        run: pytest tests/unit -q

  integration:
    # The comment this job replaces said integration tests "need a seeded Postgres,
    # which this lane deliberately does not stand up". Half of that is wrong, and the
    # wrong half is why 500+ tests sat outside CI: `tests/conftest.py` builds the
    # schema with `Base.metadata.create_all` and every test creates its own fixtures,
    # so the suite needs an EMPTY Postgres and no seed, no migrations, and no network.
    # It is exactly as hermetic as the unit lane.
    #
    # What that cost: `test_a_mixed_voidflare_store_splits_by_provenance` went red the
    # moment E-F3 landed in Phase 2 and stayed red for the whole phase, because the
    # only thing that ran it was a developer remembering to. PR #113 found it by
    # accident. Two subsequent reviews had to verify 500 tests by hand.
    #
    # fairy's genuinely seeded-DB tests (test_zo_crossval.py) skipped themselves here,
    # because `DATABASE_URL` points at this same empty database. Those files are deleted
    # in B.12. TODO(chunk-F): the Genshin crossval harness must ship with
    # `CROSSVAL_REQUIRE_DB=1` from its first commit so that "skipped" is a hard failure
    # in the lane that is supposed to run it — fairy shipped a stale golden fixture
    # precisely because a skip read as a pass here (DESIGN §3, Chunk F).
    name: Backend — integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mistilteinn
          POSTGRES_PASSWORD: mistilteinn_dev
          POSTGRES_DB: mistilteinn_test
        ports:
          - 5432:5432
        # Without this the job races the container: asyncpg connects before Postgres
        # finishes its first-boot init and the whole suite errors on connection.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mistilteinn:mistilteinn_dev@localhost:5432/mistilteinn_test
      DATABASE_URL: postgresql+asyncpg://mistilteinn:mistilteinn_dev@localhost:5432/mistilteinn_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Integration tests
        run: pytest tests/integration -q

  kit-validation:
    # =======================================================================
    # DISABLED FOR THE PORT — TODO(chunk-H). Do not delete this job.
    #
    # `if: false` is deliberate and this stanza stays in the file, because a gate
    # that is silently removed becomes a permanent gap — the exact green-by-absence
    # failure CLAUDE.md names. Deleting it would leave nothing in the repo that says
    # kit validation is supposed to exist.
    #
    # WHY IT IS OFF: `scripts/validate_kits.py` reads app/data/modifiers/**,
    # app/data/validation/known_issues.json and the ZO reference exports. All of it
    # was stripped in the fork commit (6e691e7) and the script itself is deleted in
    # B.9. There is nothing for it to validate and nothing it could report but noise.
    #
    # WHAT MUST BE RESTORED, exactly (fairy dispatched everything and let the
    # DB-dependent levels skip):
    #   L0  schema — every kit JSON matches the modifier schema
    #   L1  references — every cited source resolves
    #   L2  citations — no uncited modifier; no unverifiable citation
    #   L6  coverage — every seeded character has a kit entry
    #   LC  consistency — cross-kit contradictions
    #   LU  unmapped — stat keys with no STAT_META entry
    #   L4/L5 stay OUT of CI: they need real seeded game data and are proven by the
    #        pre-merge agent review instead (fairy issue #114). Genshin's equivalents
    #        are Chunk H's call, not an automatic carry-over.
    #
    # DO NOT restore this as `--level l0 --level l1 ...`. fairy's stale-waiver check
    # is gated on `set(levels) == set(LEVELS)`; narrowing the dispatch silently
    # switches staleness detection off for the levels that *are* listed. Dispatch
    # everything and let the unrunnable levels skip themselves.
    #
    # RESTORE WHEN: Chunk H lands the Genshin kit-JSON schema, the ported harness,
    # and a non-empty corpus. Its own DESIGN doc owns the decision.
    # =======================================================================
    if: false
    name: "Kit validation harness (DISABLED — see TODO(chunk-H))"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "Kit validation is disabled for the ZZZ->Genshin port."
          echo "See the TODO(chunk-H) block in this file for the restore conditions."
          exit 1

  frontend:
    name: "Frontend — lint (unit tests disabled: see TODO(chunk-J))"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # eslint only — it does not full-type-check, so it still passes and is worth
        # keeping. It is the only frontend signal left until Chunk J.
        run: npm run lint

      - name: Unit tests
        # =====================================================================
        # DISABLED — TODO(chunk-J). Do not delete this step.
        #
        # `npm test` and `npm run build` both fail to compile: **161 TypeScript
        # errors**, mostly TS2339/TS2345 against endpoints and schemas that no
        # longer exist (`/api/v1/agents`, `/api/v1/discs`, `/api/v1/buff-presets/*`,
        # `/api/v1/damage/*`, `DiscSetSummary`, `WEngineSummary`, …).
        #
        # This is not a regression introduced by disabling anything. The SPA is
        # fairy's ZZZ frontend, frozen until Chunk J by DESIGN §3. It was only ever
        # green because `frontend/openapi.json` was **stale**: `npm run codegen`
        # regenerates `api.types.ts` from that committed file on `pretest`, so the
        # app type-checked against a contract describing 44 endpoints while the
        # backend served 7. Regenerating the contract (review of PR #1) replaced a
        # green lane that proved nothing with a red one that is telling the truth.
        #
        # `backend/tests/unit/test_openapi_contract_is_current.py` now prevents the
        # contract from silently drifting again, so this cannot be "fixed" by
        # letting the spec rot.
        #
        # RESTORE WHEN: Chunk J rewrites the disc-shaped pages against the Genshin
        # API. That is the chunk that makes this compile; nothing smaller will.
        # =====================================================================
        if: false
        run: npm test
