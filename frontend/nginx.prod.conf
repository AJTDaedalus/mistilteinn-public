server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for all responses from this container.
    # HSTS is handled by Cloudflare (F-1), not here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none';" always;

    # Docker's embedded DNS. Named explicitly because of what happens without it:
    # `proxy_pass http://backend:8000` with a **literal hostname** is resolved **once, when
    # nginx loads its config**, and the result is cached for the process's lifetime. When the
    # backend container restarts it comes back on a new IP, and nginx goes on dialling the
    # old one — every API call 502s until someone reloads nginx, while the backend itself is
    # perfectly healthy and answers `wget http://backend:8000/...` from the same container.
    #
    # Found by deploying: on the first bring-up the backend crash-looped twice (its startup
    # purges expired sessions, which needs a schema the migrations had not created yet),
    # moved 172.19.0.3 -> 172.19.0.5, and nginx served 502 from a stack where nothing was
    # actually broken.
    #
    # A variable in `proxy_pass` is what forces resolution per request instead of per boot.
    # `valid=10s` bounds how long a stale answer can survive; `ipv6=off` because the compose
    # network is v4-only and asking for AAAA just adds a failed lookup to every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend
    location /api/ {
        # `$request_uri` explicitly: with a variable in proxy_pass, nginx no longer appends
        # the matched location automatically, and dropping it would send every request to
        # `/`. Spelling it out is unambiguous in a way the implicit form is not.
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA routing — fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
