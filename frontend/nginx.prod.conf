server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for all responses from this container.
    # HSTS is handled by Cloudflare (F-1), not here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none';" always;

    # Docker's embedded DNS. Named explicitly because of what happens without it:
    # `proxy_pass http://backend:8000` with a **literal hostname** is resolved **once, when
    # nginx loads its config**, and the result is cached for the process's lifetime. When the
    # backend container restarts it comes back on a new IP, and nginx goes on dialling the
    # old one — every API call 502s until someone reloads nginx, while the backend itself is
    # perfectly healthy and answers `wget http://backend:8000/...` from the same container.
    #
    # Found by deploying: on the first bring-up the backend crash-looped twice (its startup
    # purges expired sessions, which needs a schema the migrations had not created yet),
    # moved 172.19.0.3 -> 172.19.0.5, and nginx served 502 from a stack where nothing was
    # actually broken.
    #
    # A variable in `proxy_pass` is what forces resolution per request instead of per boot.
    # `valid=10s` bounds how long a stale answer can survive; `ipv6=off` because the compose
    # network is v4-only and asking for AAAA just adds a failed lookup to every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend
    location /api/ {
        # `$request_uri` explicitly: with a variable in proxy_pass, nginx no longer appends
        # the matched location automatically, and dropping it would send every request to
        # `/`. Spelling it out is unambiguous in a way the implicit form is not.
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vendored catalogue art. **404s rather than falling through to the SPA**, which is not
    # a nicety — the fallback below actively poisons caches.
    #
    # A request for an icon that is not there matched `location /`, so nginx answered
    # `200` with `index.html` **under a `.webp` URL**. Cloudflare caches by extension: it
    # saw `.webp`, treated the HTML body as a static asset, and stored it for four hours.
    # Any icon requested during a deploy window — or before a patch's new characters are
    # vendored — is then a guaranteed four hours of missing art, served from the edge, long
    # after the origin is correct. Measured on 2026-08-28: `UI_AvatarIcon_Ayaka.webp` held
    # `content-type: text/html` at `age=4422` while the origin had the file.
    #
    # It also restores the signal the whole icon incident turned on. A missing image now
    # answers **404**, so a status code means what it says and `curl -o /dev/null -w
    # %{http_code}` becomes a usable check instead of a permanently green one.
    location /icons/ {
        try_files $uri =404;
    }

    # The simulator, for the same reason and by this file's own instruction: *"Any future
    # directory of static assets wants its own `=404` location above for the same reason."*
    # `/gcsim/` is that directory and shipped without one.
    #
    # It matters more here than for art. `.js` is a Cloudflare default-cached extension, so a
    # deploy window where the bundle lacks the file would let the edge hold `200 text/html`
    # under `wasm_exec.js` for hours after the origin is correct — which is precisely the
    # incident recorded above, on a path that breaks a feature rather than hiding a picture.
    #
    # It also restores `gcsim-loader.ts`'s own error branch: its `if (!response.ok)` message
    # says the wasm "is not being served (404)", and could never fire while the fallback
    # answered 200.
    location /gcsim/ {
        try_files $uri =404;

        # **Revalidated, because these two filenames never change.** The bundle's own assets
        # are content-hashed; `wasm_exec.js` and `gcsim.wasm` are not, so a re-pin replaces
        # them in place. `.js` is a Cloudflare default-cached extension and `.wasm` is not,
        # which is the worst pairing available: the new wasm would reach a browser beside a
        # stale Go shim, and *that* fails inside `go.run(instance)` rather than at the fetch —
        # past every named error branch `gcsim-loader.ts` has.
        add_header Cache-Control "no-cache" always;
    }

    # Angular SPA routing — fall back to index.html for unknown paths.
    #
    # Deliberately last, and deliberately not reachable for `/icons/`. Any future directory
    # of static assets wants its own `=404` location above for the same reason.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
