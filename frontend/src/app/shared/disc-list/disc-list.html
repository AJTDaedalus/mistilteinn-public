<div class="disc-list">
  <fairy-disc-filters
    [discSets]="discSets()"
    [slotConstraint]="slotConstraint()"
    [filters]="filters()"
    (filtersChange)="onFiltersChange($event)"
  />

  <div class="disc-list__count eyebrow">
    {{ filtered().length }} disc{{ filtered().length === 1 ? '' : 's' }}
  </div>

  @if (filtered().length === 0) {
    <div class="disc-list__empty">
      <span class="eyebrow">No discs match the current filters.</span>
    </div>
  }

  <div class="disc-list__grid" [class.disc-list__grid--pick]="mode() === 'pick'">
    @for (disc of filtered(); track disc.id) {
      <div
        class="disc-list__item"
        [class.disc-list__item--clickable]="mode() === 'pick'"
        [attr.tabindex]="mode() === 'pick' ? 0 : null"
        (click)="onSelect(disc.id)"
        (keydown.enter)="onSelect(disc.id)"
        (keydown.space)="onSelect(disc.id); $event.preventDefault()"
      >
        <fairy-disc-card
          [disc]="disc"
          [setNames]="setNames()"
          [setIcons]="setIcons()"
          [setTooltips]="setTooltips()"
          [buildNames]="buildNames()"
          [selected]="disc.id === selectedDiscId()"
        />
      </div>
    }
  </div>
</div>
