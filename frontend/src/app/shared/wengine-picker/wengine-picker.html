<button
  type="button"
  class="cb-trigger"
  [class.cb-trigger--disabled]="disabled()"
  [disabled]="disabled()"
  (click)="openDialog()"
>
  <span class="cb-trigger__label" [class.cb-trigger__label--empty]="!selectedWEngine()">
    {{ selectedWEngine() ? selectedWEngine()?.name : placeholder() }}
  </span>
  <span class="cb-trigger__caret">▼</span>
</button>

<!-- Backdrop click-to-close is a mouse-only convenience; keyboard users
     already close the native <dialog> via Escape. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog #pickerDialog class="wengine-picker-dialog" (click)="$event.target === $event.currentTarget && closeDialog()">
  <div class="wp-inner">
    
    <!-- Header -->
    <div class="wp-header">
      <h2 class="wp-title">Select W-Engine</h2>
      <div class="wp-header-actions">
        @if (selectedId()) {
          <button type="button" class="link-btn" (click)="selectWEngine(null)">Unequip</button>
        }
        <button type="button" class="icon-btn" (click)="closeDialog()" aria-label="Close">✕</button>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="wp-filters">
      <!-- Search Input -->
      <div class="wp-filter-group wp-filter-group--search">
        <input
          type="search"
          class="wp-search-input"
          placeholder="Filter W-Engines…"
          [value]="search()"
          (input)="search.set($any($event.target).value)"
        />
      </div>

      <!-- Specialties (Class) Filters -->
      <div class="wp-filter-group wp-filter-group--classes">
        <span class="filter-group-label eyebrow">Class</span>
        <div class="filter-chips">
          <button
            type="button"
            class="chip-btn"
            [class.chip-btn--active]="selectedSpecialty() === null"
            (click)="selectedSpecialty.set(null)"
          >
            ALL
          </button>
          @for (spec of specialties; track spec) {
            <button
              type="button"
              class="chip-btn chip-btn--icon"
              [class.chip-btn--active]="selectedSpecialty() === spec"
              (click)="toggleSpecialty(spec)"
              [title]="spec"
            >
              @if (specialtyIcon(spec); as url) {
                <img [src]="url" class="chip-btn__img" [alt]="spec" loading="lazy" />
              }
              <span class="chip-btn__text">{{ spec }}</span>
            </button>
          }
        </div>
      </div>

      <!-- Rarity Filters -->
      <div class="wp-filter-group wp-filter-group--rarity">
        <span class="filter-group-label eyebrow">Rarity</span>
        <div class="filter-chips">
          @for (rar of rarities; track rar) {
            <button
              type="button"
              class="chip-btn"
              [class.chip-btn--active]="isRaritySelected(rar)"
              (click)="toggleRarity(rar)"
            >
              {{ rar }}-RANK
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Grid List -->
    <div class="wp-grid-container">
      @if (filteredWEngines().length === 0) {
        <div class="wp-empty mono">No matching W-Engines found.</div>
      } @else {
        <div class="wp-grid">
          @for (w of filteredWEngines(); track w.id) {
            <button
              type="button"
              class="wengine-card"
              [class.wengine-card--selected]="w.id === selectedId()"
              [class.wengine-card--rarity-S]="w.rarity === 'S'"
              [class.wengine-card--rarity-A]="w.rarity === 'A'"
              [class.wengine-card--rarity-B]="w.rarity === 'B'"
              (click)="selectWEngine(w.id)"
            >
              <div class="wengine-card__header">
                <!-- Icon Frame -->
                <div class="wengine-card__img-container">
                  @if (wEngineIcon(w.icon_path); as url) {
                    <img [src]="url" class="wengine-card__img" [alt]="w.name" loading="lazy" />
                  } @else {
                    <div class="wengine-card__placeholder">⚙️</div>
                  }
                  @if (isSignature(w.name)) {
                    <span class="wengine-card__sig-badge mono uppercase">Signature</span>
                  }
                </div>
                <!-- Specialty Badge & Rarity Star -->
                <div class="wengine-card__badges">
                  @if (specialtyIcon(w.specialty); as url) {
                    <img [src]="url" class="wengine-card__spec-badge" [alt]="w.specialty" [title]="w.specialty" />
                  }
                  <span class="wengine-card__rarity-stars">
                    @if (w.rarity === 'S') { ✦✦✦✦✦ }
                    @else if (w.rarity === 'A') { ✦✦✦✦ }
                    @else if (w.rarity === 'B') { ✦✦✦ }
                  </span>
                </div>
              </div>

              <!-- Name & Details -->
              <div class="wengine-card__info">
                <span class="wengine-card__name">{{ w.name }}</span>
                
                <!-- Stats Row -->
                <div class="wengine-card__stats mono">
                  <div class="wengine-card__stat-item">
                    <span class="stat-label">ATK</span>
                    <span class="stat-val">{{ w.base_atk }}</span>
                  </div>
                  @if (w.secondary_stat_type) {
                    <div class="wengine-card__stat-item">
                      <span class="stat-label">{{ formatStatType(w.secondary_stat_type) }}</span>
                      <span class="stat-val">{{ formatStatValue(w.secondary_stat_type, w.secondary_stat_value) }}</span>
                    </div>
                  }
                </div>
              </div>
            </button>
          }
        </div>
      }
    </div>

  </div>
</dialog>
