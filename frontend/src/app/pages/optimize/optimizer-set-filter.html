<div class="set-filter">

  <div class="set-filter__slots">
    <set-picker
      label="4-Piece"
      hint="Select one or more sets to try as the 4-piece bonus. Add a set to both slots to also try it paired with itself."
      [allSets]="allSets()"
      [selected]="fourPieceSelected()"
      (selectedChange)="onFourPieceChange($event)"
    />
    <set-picker
      label="2-Piece"
      hint="Select sets to pair with the 4-piece bonus as a 2-piece bonus."
      [allSets]="allSets()"
      [selected]="twoPieceSelected()"
      (selectedChange)="onTwoPieceChange($event)"
    />
  </div>

  @if (frameCount() > 0) {
    <p class="set-filter__summary mono">
      {{ frameCount() }} set combo{{ frameCount() === 1 ? '' : 's' }}
    </p>
  } @else if (count4pc() === 0) {
    <p class="set-filter__summary set-filter__summary--hint">
      Select a 4-piece set to begin.
    </p>
  } @else {
    <p class="set-filter__summary set-filter__summary--hint">
      Also select a 2-piece set — or add the same set to both slots for a full 6-piece run.
    </p>
  }

</div>
