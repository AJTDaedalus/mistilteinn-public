<div class="filters">
  <span class="filters__section-label eyebrow">Filter results</span>
  <div class="filters__row">
    <span class="filters__label eyebrow">Slot</span>
    <div class="seg-group">
      @for (s of slotOptions; track s) {
        <button
          type="button"
          class="seg"
          [class.seg--active]="slot() === s"
          (click)="setSlot(s)"
        >{{ s === 0 ? 'All' : s }}</button>
      }
    </div>
    <button type="button" class="reset-btn" (click)="reset()">Reset</button>
  </div>

  <div class="filters__row">
    <span class="filters__label eyebrow">Level</span>
    <div class="seg-group">
      @for (mode of levelModes; track mode) {
        <button
          type="button"
          class="seg"
          [class.seg--active]="levelMode() === mode && levelValue() !== null"
          (click)="setLevelMode(mode)"
        >{{ mode }}</button>
      }
    </div>
    <div class="lv-select-wrap">
      <select class="lv-select" [value]="levelValue() ?? ''" (change)="onLevelValueChange($event)">
        <option value="">Any</option>
        @for (lv of levelValues; track lv) {
          <option [value]="lv">{{ lv }}</option>
        }
      </select>
      <span class="lv-select-arrow">▾</span>
    </div>
  </div>

  @if (discSets().length > 0) {
    <div class="filters__row">
      <set-picker
        label="Set"
        [allSets]="discSets()"
        [selected]="sets()"
        (selectedChange)="onSetChange($event)"
      />
    </div>
  }
</div>
