<div class="equation">
  @for (term of termList(); track term.key; let first = $first) {
    @if (!first) {
      <span class="equation__sep" aria-hidden="true">×</span>
    }
    @if (term.clickable) {
      <button
        class="equation__chip"
        [class.equation__chip--active]="activeChipKey() === term.key"
        [attr.aria-expanded]="activeChipKey() === term.key"
        (click)="toggleChip(term.key)"
      >
        <span class="equation__chip-label">{{ term.label }}</span>
        <span class="equation__chip-value">{{ term.displayValue }}</span>
      </button>
    } @else {
      <div class="equation__chip equation__chip--base">
        <span class="equation__chip-label">{{ term.label }}</span>
        <span class="equation__chip-value">{{ term.displayValue }}</span>
      </div>
    }
  }
</div>

<div class="drawer-wrap" [class.drawer-wrap--open]="activeChipKey() !== null">
  <div class="drawer-inner">
    @if (activeTerm(); as term) {
      <app-buff-drawer
        [term]="term"
        [step]="step()"
        [attribution]="attribution()"
        [activeAgentName]="activeAgentName()"
      />
    }
  </div>
</div>
