<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mistilteinn">
  <!-- The Mitya emblem, standalone.
       Geometry is the same as src/app/shared/emblem/emblem.ts, and
       emblem.spec.ts asserts the two agree node-for-node so they cannot drift.
       Colours are literal here on purpose: a favicon is rendered outside the app,
       where no CSS custom property exists to resolve. -->
  <rect width="64" height="64" rx="10" fill="#1c2334"/>
  <g fill="none" stroke="#ddae21" stroke-width="2.1" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="25" ry="10"/>
    <ellipse cx="32" cy="32" rx="25" ry="10" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="25" ry="10" transform="rotate(120 32 32)"/>
  </g>
  <circle cx="57" cy="32" r="3.2" fill="#9a9db4" stroke="#a67c12" stroke-width="1"/>
  <circle cx="19.5" cy="53.7" r="3.2" fill="#9a9db4" stroke="#a67c12" stroke-width="1"/>
  <circle cx="7" cy="32" r="3.2" fill="#9a9db4" stroke="#a67c12" stroke-width="1"/>
  <circle cx="44.5" cy="10.3" r="3.2" fill="#9a9db4" stroke="#a67c12" stroke-width="1"/>
  <circle cx="44.5" cy="53.7" r="3.8" fill="#38a6d2" stroke="#ddae21" stroke-width="1.4"/>
  <circle cx="19.5" cy="10.3" r="3.8" fill="#38a6d2" stroke="#ddae21" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="7.5" fill="#ddae21" stroke="#a67c12" stroke-width="1.4"/>
  <circle cx="29.6" cy="29.6" r="2.4" fill="#f0c94f" opacity=".85"/>
</svg>
