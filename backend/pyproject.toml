[project]
name = "mistilteinn"
version = "0.1.0"
description = "Genshin Impact build optimizer and rotation simulator backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.2",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "uuid-utils>=0.9.0",
    "numpy>=1.26.0",
    "numba>=0.60.0",
    "slowapi>=0.1.9",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
# Ruff is pinned EXACTLY, not floored. CI reinstalls from this file on every run and
# resolves whatever is newest; a developer's env holds whatever was current when they
# last installed. Under `ruff>=0.5.0` those drifted apart silently — measured 2026-07-31:
# local 0.15.10 against CI's 0.16.1 — so `ruff check` passing locally said nothing about
# whether it would pass in CI. That cost two red runs on branches that were clean on the
# machine that wrote them (#128, #134).
#
# Root CLAUDE.md tells every contributor to run `ruff check` before every commit. That
# instruction is only meaningful if the local command and the CI command are the same
# program. Bump this deliberately, as its own commit, so a new rule arrives as a
# reviewable change rather than as an unrelated PR going red. See issue #135.
#
# NOT covered by this pin: `.pre-commit-config.yaml` resolves ruff from its own `rev:`,
# which is still v0.5.0 — a third version, and one that also runs `ruff-format`. Anyone
# who has run `pre-commit install` is linting against neither this pin nor CI. Bumping
# that rev is entangled with the deferred `ruff format` decision (see #135), so it is
# left alone here; keep the two in sync once that call is made.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "ruff==0.16.1",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Belt and braces: `testpaths` already keeps collection inside tests/, but naming `build`
# here means the exclusion survives anyone running `pytest app/` or widening testpaths later.
#
# `app/services/_ported/` used to be named here too. It was removed in G.1 — its three ported
# files were deleted per its own rule, and the two staged for the closed Chunk H lost their
# consumer when the successor plan chose to transcribe from gcsim's Go rather than from
# fairy's ZZZ modifier DSL. `docs/PORT_zzz_disposition.md` keeps its table.
norecursedirs = ["build"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "perf: performance benchmarks (deselected by default; enable with -m perf)",
]

[tool.ruff]
line-length = 99
target-version = "py312"
# `build/` holds a stale shadow copy of `app/` after `pip install -e .` / `python -m build`.
# Ruff already skips it via `respect-gitignore` (`.gitignore:8`), but that is a default that
# could be flipped; naming it here means correctness does not rest on it. See issue #74.
#
# `app/services/_ported/` was excluded here for the same reason and is gone in G.1 — see the
# note on `norecursedirs` above, and `docs/PORT_zzz_disposition.md`.
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
    "D",    # pydocstyle (docstring presence + form; see [tool.ruff.lint.pydocstyle])
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "PERF", # perflint
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any) are disallowed
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # implicit string concatenation (conflicts with formatter)
    "S101",    # use of assert (needed in tests)
    "TRY003",  # avoid specifying long messages outside exception class
    "PLR0913", # too many arguments to function call
    "PLR0917", # too many positional arguments (same tradeoff as PLR0913 above —
               # FastAPI route handlers are naturally positional-heavy via Depends()/Query())
    "RUF002",  # × is intentional math notation throughout damage formulas
    "RUF003",  # × in comments is intentional math notation
    "PLW2901", # loop variable reassignment is an intentional transform pattern
    "D105",    # magic methods are self-documenting; not worth requiring docstrings
    "D107",    # __init__ — the class docstring already covers construction
    "D205",    # blank-line-after-summary is a formatting nitpick, not "docstring exists"
    "D209",    # closing-quotes-on-own-line is a formatting nitpick, not "docstring exists"
    "D400",    # trailing-period is a formatting nitpick, not "docstring exists"
    "D401",    # imperative-mood is a prose-style nitpick, not "docstring exists"
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101", "ARG", "PLR2004", "PLC0415", "SLF001", "S301", "N806", "F821", "PLR0912", "PLR0915", "A002", "PERF401", "D"]
"tests/perf/**/*.py" = ["E501"]
"alembic/**/*.py" = ["ANN", "ERA", "D"]
"app/schemas/**/*.py" = ["TC001"]
# SQLAlchemy resolves `Mapped[Element]` annotations at runtime through
# typing.get_type_hints, so an enum moved into a TYPE_CHECKING block makes every model in
# the file fail to map. Same reason app/schemas/ is listed above.
"app/models/**/*.py" = ["TC001"]
"app/api/**/*.py" = ["TC001", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
