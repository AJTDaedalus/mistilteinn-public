# ---------------------------------------------------------------------------
# mistilteinn does NOT run its own Postgres (DESIGN §A3, owner ruling 2026-08-21).
#
# One postgres:16 container — the one owned by the fairy compose stack at
# /root/fairy — serves four databases:
#
#     fairy / fairy_test          ← ZZZ, fairy's own alembic_version
#     mistilteinn / mistilteinn_test  ← Genshin, this repo's alembic_version
#
# The two migration histories never interact, which is the reason separate
# databases beat a shared database with a `genshin` schema.
#
# Consequences, all deliberate:
#   - There is no `db` service here and no `depends_on: db`. Startup ordering
#     is no longer ours to enforce, so the backend retries its first connect
#     with a bounded backoff and then fails loudly (app/database.py, A.7).
#   - `backend` reaches Postgres over the **host gateway**, not by joining fairy's
#     compose network. Joining it was the original design and it was wrong: Compose
#     registers the *service name* as a network alias on every network a service
#     joins, so `mistilteinn-backend-1` claimed the alias `backend` on
#     `fairy_default` — where fairy's own `backend` service already lives. Docker's
#     embedded DNS then round-robins `http://backend:8000` between the two, and
#     fairy's cloudflared and nginx both resolve exactly that name. With both stacks
#     up, fairy's public tunnel would intermittently serve mistilteinn's API.
#     Verified on the running container before the change:
#       fairy_default: [mistilteinn-backend-1 backend]
#     Explicit `aliases:` cannot fix it — they are additive; the service-name alias
#     is not removable. So we do not join the network at all.
#   - The databases and the `mistilteinn` role must PRE-EXIST. Nothing here
#     creates them; see the A.6 entry in docs/LOG_mistilteinn.md for the exact
#     CREATE statements.
#   - Host ports are 8001/4201, not fairy's 8000/4200, so both stacks can run
#     at once on this box.
# ---------------------------------------------------------------------------

# The project name, pinned rather than inherited from the directory.
#
# Compose derives it from the **containing folder** by default, and every network,
# container and volume here is named after it. So the whole separation from fairy above —
# "we do not join fairy's network" — rested on this checkout happening to be called
# `mistilteinn`. It is, on this box and on the prod box, which is why nothing ever went
# wrong and why nothing would have said so.
#
# `tests/unit/test_prod_stack_can_coexist_with_fairy.py` asserts that every network belongs
# to this project, and it could not fail while the directory supplied the answer: run the
# same files from a folder named anything else and the network is `<that folder>_default`.
# `ci_local --clean` found exactly that, from its fresh clone in a temp directory — the
# check was green for a reason unrelated to the compose files.
#
# Pinning it changes nothing about the running stacks (both are already `mistilteinn`) and
# makes the guarantee the file's own rather than the filesystem's.
name: mistilteinn

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      TESTING: "false"
      LOG_LEVEL: info
      PYTHONPATH: /app
      # **Belt and braces with `ConsoleEmailSender`'s own `flush=True`.** Python buffers
      # stdout when it is not a TTY, and in a container it never is — so anything printed
      # rather than logged vanishes. The console mail sender is the *default* provider, and a
      # verification link nobody can read is a signup flow that looks broken.
      PYTHONUNBUFFERED: "1"
      # ── Open registration (DESIGN_open_registration.md) ──────────────────────
      # **Enumerated here because this service has no `env_file:`.** A setting absent from
      # this list is invisible to the app whatever `.env` says, and invisible *silently*:
      # verification mail printed to a container log nobody reads, links pointing at
      # localhost, Turnstile off, and a signup flow that looks like it worked. That was the
      # first finding of fairy's pre-merge review of this same feature.
      # `backend/tests/unit/test_settings_reach_the_container.py` reads this file and fails
      # if a setting is missing.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4201}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      AUTO_APPROVE_ON_VERIFY: ${AUTO_APPROVE_ON_VERIFY:-false}
      EMAIL_VERIFY_TTL_SECONDS: ${EMAIL_VERIFY_TTL_SECONDS:-86400}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      MAX_ARTIFACTS_PER_USER: ${MAX_ARTIFACTS_PER_USER:-10000}
      MAX_BUILDS_PER_USER: ${MAX_BUILDS_PER_USER:-500}
      MAX_TEAMS_PER_USER: ${MAX_TEAMS_PER_USER:-200}
      MAX_ROTATIONS_PER_USER: ${MAX_ROTATIONS_PER_USER:-500}
      MAX_OPTIMIZATION_RUNS_PER_USER: ${MAX_OPTIMIZATION_RUNS_PER_USER:-500}
      MAX_GCSIM_IMPORTS_PER_DAY: ${MAX_GCSIM_IMPORTS_PER_DAY:-20}
      MAX_SIM_RUNS_PER_DAY: ${MAX_SIM_RUNS_PER_DAY:-200}
      UNVERIFIED_REAP_DAYS: ${UNVERIFIED_REAP_DAYS:-30}
    extra_hosts:
      # Reach the shared Postgres through the host's published 5432 rather than by
      # joining fairy's compose network — see the note at the top of this file.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-include '*.py' --reload-exclude '*.json' --reload-exclude '*.yaml'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4201:4200"
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the in-container artifacts from being
      # masked by the host bind mount.
      - /app/node_modules
      - /app/.angular
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # cloudflared — Cloudflare Tunnel
  #
  # Two profiles:
  #
  #   tunnel-quick  (default testing, no domain needed):
  #     docker compose --profile tunnel-quick up -d cloudflared-quick
  #     The assigned *.trycloudflare.com URL is printed in the container log.
  #     URL changes on restart.
  #
  #   tunnel  (named tunnel, stable hostname, requires a Cloudflare domain):
  #     Set CLOUDFLARE_TUNNEL_TOKEN in .env, then:
  #     docker compose --profile tunnel up -d cloudflared
  #     See cloudflare/README.md for full setup steps.
  #
  # In both cases the tunnel reaches the backend over the internal Docker
  # network; no inbound ports need to be opened on the host.
  # ---------------------------------------------------------------------------
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://backend:8000
    profiles:
      - tunnel-quick

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - run
    profiles:
      - tunnel

# No `networks:` block. mistilteinn's services share this project's implicit default
# network and nothing else; the database is reached through the host gateway above.
