# ---------------------------------------------------------------------------
# mistilteinn does NOT run its own Postgres (DESIGN §A3, owner ruling 2026-08-21).
#
# One postgres:16 container — the one owned by the fairy compose stack at
# /root/fairy — serves four databases:
#
#     fairy / fairy_test          ← ZZZ, fairy's own alembic_version
#     mistilteinn / mistilteinn_test  ← Genshin, this repo's alembic_version
#
# The two migration histories never interact, which is the reason separate
# databases beat a shared database with a `genshin` schema.
#
# Consequences, all deliberate:
#   - There is no `db` service here and no `depends_on: db`. Startup ordering
#     is no longer ours to enforce, so the backend retries its first connect
#     with a bounded backoff and then fails loudly (app/database.py, A.7).
#   - `backend` reaches Postgres over the **host gateway**, not by joining fairy's
#     compose network. Joining it was the original design and it was wrong: Compose
#     registers the *service name* as a network alias on every network a service
#     joins, so `mistilteinn-backend-1` claimed the alias `backend` on
#     `fairy_default` — where fairy's own `backend` service already lives. Docker's
#     embedded DNS then round-robins `http://backend:8000` between the two, and
#     fairy's cloudflared and nginx both resolve exactly that name. With both stacks
#     up, fairy's public tunnel would intermittently serve mistilteinn's API.
#     Verified on the running container before the change:
#       fairy_default: [mistilteinn-backend-1 backend]
#     Explicit `aliases:` cannot fix it — they are additive; the service-name alias
#     is not removable. So we do not join the network at all.
#   - The databases and the `mistilteinn` role must PRE-EXIST. Nothing here
#     creates them; see the A.6 entry in docs/LOG_mistilteinn.md for the exact
#     CREATE statements.
#   - Host ports are 8001/4201, not fairy's 8000/4200, so both stacks can run
#     at once on this box.
# ---------------------------------------------------------------------------
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      TESTING: "false"
      LOG_LEVEL: info
      PYTHONPATH: /app
    extra_hosts:
      # Reach the shared Postgres through the host's published 5432 rather than by
      # joining fairy's compose network — see the note at the top of this file.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-include '*.py' --reload-exclude '*.json' --reload-exclude '*.yaml'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4201:4200"
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the in-container artifacts from being
      # masked by the host bind mount.
      - /app/node_modules
      - /app/.angular
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # cloudflared — Cloudflare Tunnel
  #
  # Two profiles:
  #
  #   tunnel-quick  (default testing, no domain needed):
  #     docker compose --profile tunnel-quick up -d cloudflared-quick
  #     The assigned *.trycloudflare.com URL is printed in the container log.
  #     URL changes on restart.
  #
  #   tunnel  (named tunnel, stable hostname, requires a Cloudflare domain):
  #     Set CLOUDFLARE_TUNNEL_TOKEN in .env, then:
  #     docker compose --profile tunnel up -d cloudflared
  #     See cloudflare/README.md for full setup steps.
  #
  # In both cases the tunnel reaches the backend over the internal Docker
  # network; no inbound ports need to be opened on the host.
  # ---------------------------------------------------------------------------
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://backend:8000
    profiles:
      - tunnel-quick

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - run
    profiles:
      - tunnel

# No `networks:` block. mistilteinn's services share this project's implicit default
# network and nothing else; the database is reached through the host gateway above.
