# Production override — use alongside docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# mistilteinn and fairy run on the same box, as `mistilteinn.aetherus.dev` and
# `fairy.aetherus.dev` (owner ruling, 2026-08-22). Everything below is about making that
# safe rather than merely possible.
#
# ── Why prod has its own Postgres when dev shares fairy's ─────────────────────
#
# In development this stack has no `db` service: the `mistilteinn` and `mistilteinn_test`
# databases live inside fairy's container and are reached over the host gateway
# (`host.docker.internal:5432`). That works because fairy's *dev* compose publishes 5432.
#
# **fairy's prod does not.** `docker-compose.prod.yml` there sets `db: ports: !reset []`, so
# there is no host port to reach and `host.docker.internal:5432` finds nothing. Carrying the
# dev arrangement into prod would deploy a stack that cannot open a connection.
#
# Three ways out, and why this one:
#
#   1. Publish fairy's prod Postgres on the host. Changes fairy to suit mistilteinn, and
#      re-opens a port prod deliberately closed.
#   2. Join fairy's compose network and reach `db` by service name. **This is the recorded
#      hazard.** Chunk A found that joining `fairy_default` registers this backend under the
#      alias `backend`, where fairy's own backend already lives — so fairy's tunnel
#      intermittently served mistilteinn's API. Both projects name a service `backend`, so
#      the collision is guaranteed, and it is invisible until traffic reaches the wrong app.
#   3. **Own Postgres in prod.** Chosen. No change to fairy, no shared network, and the two
#      apps fail independently: fairy can be rebuilt without taking mistilteinn's data down.
#
# The cost is that dev and prod differ in where the database lives, which is a real
# divergence and is stated here rather than discovered. It is contained: the application
# only ever sees `DATABASE_URL`, so nothing but compose knows the difference.
#
# ── Why co-existence needs no shared network ─────────────────────────────────
#
# Each stack runs **its own cloudflared**, reaching its own nginx over its own project
# network — which is what fairy already does. Two tunnels, two tokens, no shared anything.
# Neither stack publishes a host port in prod, so the dev ports (8001/4201) cannot collide
# either.

services:
  db:
    # mistilteinn's own database in production — see the header for why.
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    ports: !reset []          # nginx proxies /api/ over the internal network
    volumes: !reset []        # no source bind mounts; the image carries the code
    # Dropped deliberately. In dev this maps `host.docker.internal` to the host gateway so
    # the backend can reach fairy's Postgres. In prod this stack owns its database, and
    # leaving the mapping in place would let a dev `.env` copied to the box **resolve** —
    # to whatever happens to be listening on the host's 5432 — instead of failing. A wrong
    # database that connects is worse than one that does not.
    extra_hosts: !reset []
    # `db`, not `host.docker.internal` — this stack owns its database in production.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      # **This is production, and until now nothing said so.** `Settings.ENV` defaults to
      # `"local"` and neither compose file overrode it, so every `settings.ENV == "production"`
      # branch in the codebase was dead here — including `email_preflight`, whose entire job is
      # to refuse a deploy whose mail cannot work. It was a no-op in the one place it exists
      # for. `tests/unit/test_settings_reach_the_container.py` now asserts this line.
      ENV: production
      # ── Open registration (DESIGN_open_registration.md) ──────────────────────
      # **Enumerated here because this service has no `env_file:`.** A setting absent from
      # this list is invisible to the app whatever `.env` says, and invisible *silently*:
      # verification mail printed to a container log nobody reads, links pointing at
      # localhost, Turnstile off, and a signup flow that looks like it worked. That was the
      # first finding of fairy's pre-merge review of this same feature.
      # `backend/tests/unit/test_settings_reach_the_container.py` reads this file and fails
      # if a setting is missing.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}   # `resend` once the key is set; see DEPLOY.md §4a
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # **No localhost fallback in production.** The dev file defaults this to
      # `localhost:4201`, and inheriting that here would point every verification link at the
      # recipient's own machine — the single most likely way this feature fails silently.
      # Unset resolves to the real origin instead, and `email_preflight` refuses to boot on
      # anything local-looking regardless.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://mistilteinn.aetherus.dev}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      AUTO_APPROVE_ON_VERIFY: ${AUTO_APPROVE_ON_VERIFY:-false}
      EMAIL_VERIFY_TTL_SECONDS: ${EMAIL_VERIFY_TTL_SECONDS:-86400}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      MAX_ARTIFACTS_PER_USER: ${MAX_ARTIFACTS_PER_USER:-10000}
      MAX_BUILDS_PER_USER: ${MAX_BUILDS_PER_USER:-500}
      MAX_TEAMS_PER_USER: ${MAX_TEAMS_PER_USER:-200}
      MAX_ROTATIONS_PER_USER: ${MAX_ROTATIONS_PER_USER:-500}
      MAX_GCSIM_IMPORTS_PER_DAY: ${MAX_GCSIM_IMPORTS_PER_DAY:-20}
      MAX_SIM_RUNS_PER_DAY: ${MAX_SIM_RUNS_PER_DAY:-200}
      UNVERIFIED_REAP_DAYS: ${UNVERIFIED_REAP_DAYS:-30}
    # `--forwarded-allow-ips` is what makes `X-Forwarded-For` / `X-Real-IP` mean anything:
    # uvicorn ignores them unless the immediate peer is trusted, and the peer here is the
    # nginx *container*, not 127.0.0.1. Without this every per-IP rate limit is a single
    # global bucket keyed on nginx's Docker address — see DESIGN_open_registration.md §2.
    #
    # `*` is safe **only** because this service publishes no host port (`ports: !reset []`
    # above) and is reachable solely through nginx on the internal network. If that ever
    # changes, `*` becomes a header-spoofing hole and this must be pinned to nginx's subnet.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      --forwarded-allow-ips ${TRUSTED_PROXY_IPS:-*}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      # **The repo root, not `./frontend`.** The image builds gcsim's browser wasm itself, and
      # the pin it must build at lives in `docs/CROSSVAL_gcsim.md` — the one document that owns
      # it. Restating the pin in an env var or a build arg would be a second definition of
      # "correct"; widening the context is the cheaper price. `.dockerignore` keeps it small.
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports: !reset []          # no host ports; cloudflared reaches nginx internally
    volumes: !reset []        # nginx serves the pre-built bundle
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    # mistilteinn's **own** named tunnel, with its own token. Not an ingress rule on
    # fairy's: a second rule there would need cloudflared to resolve this project's nginx,
    # which means the shared network option 2 rejects.
    depends_on:
      - frontend
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://frontend:80
      - run
    profiles: !reset []       # active by default in prod, no profile flag needed

# `restart: unless-stopped` on every service, for the reason fairy learned on 2026-07-28:
# with a policy only on cloudflared, a host reboot brought the tunnel back while the app
# stayed down — so the site answered 502 rather than failing obviously. `unless-stopped`
# rather than `always`, so a service stopped deliberately for maintenance stays stopped.
